  <g transform="translate(900,515)">
    <rect width="285" height="465" rx="34" fill="#3b3d42"/>
    <rect x="14" y="14" width="257" height="390" rx="24" fill="#54575e"/>
    <g stroke="#44474d" stroke-width="6">
      <line x1="40" y1="70" x2="245" y2="70"/><line x1="40" y1="110" x2="245" y2="110"/><line x1="40" y1="150" x2="245" y2="150"/>
      <line x1="40" y1="190" x2="245" y2="190"/><line x1="40" y1="230" x2="245" y2="230"/><line x1="40" y1="270" x2="245" y2="270"/>
      <line x1="40" y1="310" x2="245" y2="310"/><line x1="40" y1="350" x2="245" y2="350"/>
    </g>
    <line x1="0" y1="495" x2="285" y2="495" stroke="#d33" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="0" y1="485" x2="0" y2="505" stroke="#d33" stroke-width="3"/><line x1="285" y1="485" x2="285" y2="505" stroke="#d33" stroke-width="3"/>
    <text x="142" y="530" font-size="24" fill="#d33" text-anchor="middle" font-weight="700">약 95 mm</text>
    <line x1="-30" y1="0" x2="-30" y2="465" stroke="#d33" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="465" x2="-20" y2="465" stroke="#d33" stroke-width="3"/>
