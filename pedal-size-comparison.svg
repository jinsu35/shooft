  </g>
  <text x="1042" y="445" font-size="28" font-weight="700" fill="#222" text-anchor="middle">③ 가정용 미싱 페달 (브라더형)</text>
  <text x="1042" y="480" font-size="21" fill="#555" text-anchor="middle">₩11,350 · 아날로그 · 약 147cm² (추정치)</text>

  <!-- F: PCsensor FS1-P type (iKKEGOL 10655Y) 131 x 141 mm => 393 x 423 px -->
  <g transform="translate(1320,557)">
    <rect width="393" height="423" rx="46" fill="#6d7075"/>
    <rect x="69" y="30" width="255" height="350" rx="90" fill="#ecdf4e"/>
    <rect x="109" y="80" width="175" height="250" rx="70" fill="none" stroke="#d9cc3c" stroke-width="6"/>
    <line x1="0" y1="453" x2="393" y2="453" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="443" x2="0" y2="463" stroke="#d33" stroke-width="3"/><line x1="393" y1="443" x2="393" y2="463" stroke="#d33" stroke-width="3"/>
    <text x="196" y="488" font-size="24" fill="#d33" text-anchor="middle" font-weight="700">131 mm</text>
    <line x1="-30" y1="0" x2="-30" y2="423" stroke="#d33" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="423" x2="-20" y2="423" stroke="#d33" stroke-width="3"/>
    <text x="-45" y="211" font-size="24" fill="#d33" text-anchor="middle" font-weight="700" transform="rotate(-90 -45 211)">141 mm</text>
