  <rect x="1868" y="300" width="750" height="4" fill="#15803d"/>
  <text x="2243" y="330" font-size="30" font-weight="700" fill="#1d1d1f" text-anchor="middle">③ 알리 FS2020U1 — 추천</text>
  <text x="2243" y="368" font-size="23" fill="#444" text-anchor="middle">약 ₩30,000 · 빠르면 3일</text>
  <text x="2243" y="404" font-size="22" fill="#15803d" font-weight="700" text-anchor="middle">맥 작동 구매자 리뷰 확인 · 가장 큼</text>
  <text x="2243" y="438" font-size="22" fill="#555" text-anchor="middle">면적 약 563cm² · 리뷰 54개 / 4.9점</text>

  <!-- reference: sewing pedal -->
  <g transform="translate(2778,450)">
    <rect width="190" height="310" rx="24" fill="none" stroke="#999" stroke-width="4" stroke-dasharray="12 9"/>
    <text x="95" y="150" font-size="22" fill="#777" text-anchor="middle">미싱 페달</text>
    <text x="95" y="182" font-size="20" fill="#777" text-anchor="middle">약 95×155mm</text>
    <text x="95" y="214" font-size="20" fill="#777" text-anchor="middle">(추정치)</text>
  </g>
  <text x="2873" y="404" font-size="24" font-weight="700" fill="#666" text-anchor="middle">참고 기준</text>
</svg>
