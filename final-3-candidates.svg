    <line x1="-30" y1="0" x2="-30" y2="300" stroke="#d33" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="300" x2="-20" y2="300" stroke="#d33" stroke-width="3"/>
    <text x="-45" y="150" font-size="24" fill="#d33" text-anchor="middle" font-weight="700" transform="rotate(-90 -45 150)">150 mm</text>
