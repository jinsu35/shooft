  <text x="640" y="571" font-size="28" font-weight="700" fill="#222" text-anchor="middle">② 노란 와이드 페달 (FS17)</text>
  <text x="640" y="606" font-size="21" fill="#555" text-anchor="middle">₩37,091 · 무선 · 면적 약 105cm² (+48%)</text>


