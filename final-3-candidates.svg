    <rect x="280" y="28" width="190" height="244" rx="20" fill="#3d3d44"/>
    <rect x="512" y="28" width="190" height="244" rx="20" fill="#3d3d44"/>
    <g fill="#e05252" font-size="26" font-weight="700" text-anchor="middle">
