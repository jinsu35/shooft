  <text x="1361" y="404" font-size="22" fill="#c2410c" text-anchor="middle">맥 작동 미확인 · ①과 같은 모델</text>
  <text x="1361" y="438" font-size="22" fill="#555" text-anchor="middle">면적 약 528cm² · 광전식(무음)</text>

