    </g>
    <line x1="0" y1="330" x2="750" y2="330" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="320" x2="0" y2="340" stroke="#d33" stroke-width="3"/><line x1="750" y1="320" x2="750" y2="340" stroke="#d33" stroke-width="3"/>
