<svg xmlns="http://www.w3.org/2000/svg" width="3150" height="920" viewBox="0 0 3150 920" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <!-- scale: 2 px = 1 mm, top view -->
  <rect width="3150" height="920" fill="#f6f5f1"/>
  <text x="80" y="72" font-size="38" font-weight="700" fill="#1d1d1f">최종 후보 3개 크기 비교 — 위에서 본 모습 (같은 비율, 2px = 1mm)</text>
  <text x="80" y="112" font-size="22" fill="#666">①②는 같은 모델(FS23)이라 크기가 동일합니다 · 맨 오른쪽 점선은 미싱 페달(참고용)</text>

  <line x1="60" y1="760" x2="3090" y2="760" stroke="#ccc" stroke-width="2"/>

  <!-- 1) Coupang FS23-P 49,000 -->
  <g transform="translate(120,472)">
    <path d="M40 0 H694 Q734 0 734 40 V248 Q734 288 694 288 H40 Q0 288 0 248 V40 Q0 0 40 0 Z" fill="#232326"/>
    <rect x="46" y="26" width="186" height="236" rx="20" fill="#3a3a40"/>
    <rect x="274" y="26" width="186" height="236" rx="20" fill="#3a3a40"/>
    <rect x="502" y="26" width="186" height="236" rx="20" fill="#3a3a40"/>
    <g fill="#e05252" font-size="26" font-weight="700" text-anchor="middle">
      <text x="139" y="155">Shift</text><text x="367" y="155">Shift</text><text x="595" y="155">Shift</text>
    </g>
    <line x1="0" y1="318" x2="734" y2="318" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="308" x2="0" y2="328" stroke="#d33" stroke-width="3"/><line x1="734" y1="308" x2="734" y2="328" stroke="#d33" stroke-width="3"/>
    <text x="367" y="353" font-size="24" fill="#d33" text-anchor="middle" font-weight="700">367 mm</text>
    <line x1="-30" y1="0" x2="-30" y2="288" stroke="#d33" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="288" x2="-20" y2="288" stroke="#d33" stroke-width="3"/>
    <text x="-45" y="144" font-size="24" fill="#d33" text-anchor="middle" font-weight="700" transform="rotate(-90 -45 144)">144 mm</text>
  </g>
  <text x="487" y="330" font-size="30" font-weight="700" fill="#1d1d1f" text-anchor="middle">① 쿠팡 FS23-P</text>
  <text x="487" y="368" font-size="23" fill="#444" text-anchor="middle">₩49,000 · 내일(9/20) 도착 보장</text>
  <text x="487" y="404" font-size="22" fill="#c2410c" text-anchor="middle">맥 작동 미확인 · 판매자 "프로그램 켜둬야" 답변</text>
  <text x="487" y="438" font-size="22" fill="#555" text-anchor="middle">면적 약 528cm² · 광전식(무음)</text>

  <!-- 2) Coupang FS23-P 40,000 -->
  <g transform="translate(994,472)">
    <path d="M40 0 H694 Q734 0 734 40 V248 Q734 288 694 288 H40 Q0 288 0 248 V40 Q0 0 40 0 Z" fill="#232326"/>
    <rect x="46" y="26" width="186" height="236" rx="20" fill="#3a3a40"/>
    <rect x="274" y="26" width="186" height="236" rx="20" fill="#3a3a40"/>
    <rect x="502" y="26" width="186" height="236" rx="20" fill="#3a3a40"/>
    <g fill="#e05252" font-size="26" font-weight="700" text-anchor="middle">
      <text x="139" y="155">Shift</text><text x="367" y="155">Shift</text><text x="595" y="155">Shift</text>
    </g>
    <line x1="0" y1="318" x2="734" y2="318" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="308" x2="0" y2="328" stroke="#d33" stroke-width="3"/><line x1="734" y1="308" x2="734" y2="328" stroke="#d33" stroke-width="3"/>
