  <text x="1516" y="487" font-size="28" font-weight="700" fill="#222" text-anchor="middle">④ 대형 USB 페달 (회색+노랑)</text>
  <text x="1516" y="522" font-size="21" fill="#555" text-anchor="middle">₩28,550 · 유선 USB · 약 185cm²</text>

  <!-- C: Elgato Stream Deck Pedal 244 x 175 mm => 732 x 525 px -->
  <g transform="translate(1840,455)">
    <rect width="732" height="525" rx="40" fill="#1d1d1f"/>
    <rect x="18" y="20" width="200" height="440" rx="22" fill="#34343a"/>
    <rect x="232" y="20" width="268" height="440" rx="22" fill="#34343a"/>
    <rect x="514" y="20" width="200" height="440" rx="22" fill="#34343a"/>
    <g stroke="#26262b" stroke-width="5">
      <line x1="40" y1="80" x2="196" y2="80"/><line x1="40" y1="120" x2="196" y2="120"/><line x1="40" y1="160" x2="196" y2="160"/>
      <line x1="256" y1="80" x2="476" y2="80"/><line x1="256" y1="120" x2="476" y2="120"/><line x1="256" y1="160" x2="476" y2="160"/>
      <line x1="536" y1="80" x2="692" y2="80"/><line x1="536" y1="120" x2="692" y2="120"/><line x1="536" y1="160" x2="692" y2="160"/>
    </g>
    <line x1="0" y1="555" x2="732" y2="555" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="545" x2="0" y2="565" stroke="#d33" stroke-width="3"/><line x1="732" y1="545" x2="732" y2="565" stroke="#d33" stroke-width="3"/>
    <text x="366" y="590" font-size="24" fill="#d33" text-anchor="middle" font-weight="700">244 mm</text>
    <line x1="-30" y1="0" x2="-30" y2="525" stroke="#d33" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="525" x2="-20" y2="525" stroke="#d33" stroke-width="3"/>
    <text x="-45" y="262" font-size="24" fill="#d33" text-anchor="middle" font-weight="700" transform="rotate(-90 -45 262)">175 mm</text>
  </g>
  <text x="2206" y="385" font-size="28" font-weight="700" fill="#222" text-anchor="middle">⑤ Elgato Stream Deck Pedal</text>
  <text x="2206" y="420" font-size="21" fill="#555" text-anchor="middle">약 ₩100,000+ · 유선 USB-C · 페달 3개 · 면적 약 427cm² · 930g</text>

  <!-- T: PCsensor FS2020U1 triple pedal 375 x 150 mm => 1125 x 450 px -->
  <g transform="translate(2740,530)">
    <path d="M60 0 H1065 Q1125 0 1125 60 V400 Q1125 450 1075 450 H50 Q0 450 0 400 V60 Q0 0 60 0 Z" fill="#232326"/>
    <rect x="60" y="36" width="285" height="350" rx="26" fill="#3a3a40"/>
    <rect x="420" y="36" width="285" height="350" rx="26" fill="#3a3a40"/>
    <rect x="780" y="36" width="285" height="350" rx="26" fill="#3a3a40"/>
    <g fill="#d33" font-size="30" font-weight="700" text-anchor="middle">
      <text x="202" y="225">Shift</text><text x="562" y="225">Shift</text><text x="922" y="225">Shift</text>
    </g>
    <line x1="0" y1="480" x2="1125" y2="480" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="470" x2="0" y2="490" stroke="#d33" stroke-width="3"/><line x1="1125" y1="470" x2="1125" y2="490" stroke="#d33" stroke-width="3"/>
    <text x="562" y="515" font-size="24" fill="#d33" text-anchor="middle" font-weight="700">375 mm</text>
    <line x1="-30" y1="0" x2="-30" y2="450" stroke="#d33" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="450" x2="-20" y2="450" stroke="#d33" stroke-width="3"/>
    <text x="-45" y="225" font-size="24" fill="#d33" text-anchor="middle" font-weight="700" transform="rotate(-90 -45 225)">150 mm</text>
  </g>
  <text x="3302" y="460" font-size="28" font-weight="700" fill="#222" text-anchor="middle">⑥ PCsensor FS2020U1 (3페달, 전부 Shift로 설정)</text>
  <text x="3302" y="495" font-size="21" fill="#555" text-anchor="middle">₩25,400–28,100 · 유선 USB · 약 563cm² · 맥 작동 리뷰 확인</text>

  <!-- D: shoe outline ~ 100 x 270 mm => 300 x 810 px -->
  <g transform="translate(4000,170)">
    <path d="M150 0 C 250 0, 300 110, 292 260 C 286 380, 250 470, 245 560 C 242 650, 262 700, 250 760 C 240 810, 60 810, 50 760 C 38 700, 58 650, 50 560 C 42 470, 10 380, 6 260 C 0 110, 50 0, 150 0 Z"
          fill="none" stroke="#888" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="150" y="420" font-size="24" fill="#777" text-anchor="middle">신발</text>
    <text x="150" y="452" font-size="20" fill="#777" text-anchor="middle">약 100 × 270 mm</text>
  </g>
  <text x="4150" y="140" font-size="28" font-weight="700" fill="#222" text-anchor="middle">⑦ 참고: 신발 크기</text>
</svg>
