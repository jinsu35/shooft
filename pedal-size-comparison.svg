<svg xmlns="http://www.w3.org/2000/svg" width="4380" height="1100" viewBox="0 0 4380 1100" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <!-- scale: 3 px = 1 mm, top view -->
  <rect width="4380" height="1100" fill="#f6f5f1"/>
  <text x="60" y="70" font-size="36" font-weight="700" fill="#222">페달 크기 비교 — 위에서 본 모습 (같은 비율, 3px = 1mm)</text>
  <text x="60" y="110" font-size="22" fill="#666">점선 = 성인 신발 (약 270mm, 참고용)</text>

  <!-- ground line (heel edge aligned) y=980 -->
  <line x1="40" y1="980" x2="4340" y2="980" stroke="#ccc" stroke-width="2"/>

  <!-- A: bought pedal FS2007-type 71 x 100 mm => 213 x 300 px -->
  <g transform="translate(140,680)">
    <rect width="213" height="300" rx="26" fill="#2a2a2a"/>
    <rect x="14" y="12" width="185" height="230" rx="18" fill="#3a3a3a"/>
    <g stroke="#1c1c1c" stroke-width="6">
      <line x1="30" y1="50" x2="183" y2="50"/><line x1="30" y1="80" x2="183" y2="80"/>
      <line x1="30" y1="110" x2="183" y2="110"/><line x1="30" y1="140" x2="183" y2="140"/>
      <line x1="30" y1="170" x2="183" y2="170"/><line x1="30" y1="200" x2="183" y2="200"/>
    </g>
    <!-- dims -->
    <line x1="0" y1="330" x2="213" y2="330" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="320" x2="0" y2="340" stroke="#d33" stroke-width="3"/><line x1="213" y1="320" x2="213" y2="340" stroke="#d33" stroke-width="3"/>
    <text x="106" y="365" font-size="24" fill="#d33" text-anchor="middle" font-weight="700">71 mm</text>
    <line x1="-30" y1="0" x2="-30" y2="300" stroke="#d33" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="300" x2="-20" y2="300" stroke="#d33" stroke-width="3"/>
    <text x="-45" y="150" font-size="24" fill="#d33" text-anchor="middle" font-weight="700" transform="rotate(-90 -45 150)">100 mm</text>
  </g>
  <text x="246" y="610" font-size="28" font-weight="700" fill="#222" text-anchor="middle">① 구매한 페달</text>
  <text x="246" y="645" font-size="21" fill="#555" text-anchor="middle">₩7,425 · 유선 USB · 면적 약 71cm²</text>

  <!-- B: FS17 / FS2017 body 93 x 113 mm => 279 x 339 px -->
  <g transform="translate(500,641)">
    <rect width="279" height="339" rx="30" fill="#2a2a2a"/>
    <rect x="0" y="0" width="279" height="300" rx="30" fill="#ecdf4e"/>
    <rect x="40" y="40" width="199" height="200" rx="60" fill="none" stroke="#d9cc3c" stroke-width="6"/>
    <line x1="0" y1="369" x2="279" y2="369" stroke="#d33" stroke-width="3"/>
    <line x1="0" y1="359" x2="0" y2="379" stroke="#d33" stroke-width="3"/><line x1="279" y1="359" x2="279" y2="379" stroke="#d33" stroke-width="3"/>
    <text x="140" y="404" font-size="24" fill="#d33" text-anchor="middle" font-weight="700">93 mm</text>
    <line x1="-30" y1="0" x2="-30" y2="339" stroke="#d33" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#d33" stroke-width="3"/><line x1="-40" y1="339" x2="-20" y2="339" stroke="#d33" stroke-width="3"/>
    <text x="-45" y="170" font-size="24" fill="#d33" text-anchor="middle" font-weight="700" transform="rotate(-90 -45 170)">113 mm</text>
